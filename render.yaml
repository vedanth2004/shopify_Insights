services:
  # Backend Web Service
  - type: web
    name: shopify-insights-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      # DATABASE_URL is automatically set when linking PostgreSQL database in Render
      # No need to set it manually - Render handles this automatically
      - key: JWT_SECRET
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_HOST
        sync: false
        # Your Render frontend URL (without https://)
      - key: FRONTEND_URL
        sync: false
        # Your Render frontend URL (with https://)
      - key: CORS_ORIGIN
        sync: false
        # Your Render frontend URL (with https://)
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: shopify-insights-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
        # Your Render backend URL
      - key: NEXTAUTH_URL
        sync: false
        # Your Render frontend URL
      - key: NEXTAUTH_SECRET
        generateValue: true

  # PostgreSQL Database
  - type: pgsql
    name: shopify-insights-db
    plan: free
    databaseName: shopify_insights
    user: shopify_user

