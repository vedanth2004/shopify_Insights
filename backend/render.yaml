services:
  - type: web
    name: shopify-insights-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
        # Supabase connection string: postgresql://postgres.[PROJECT_REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_HOST
        sync: false
        # Your Vercel frontend URL (without https://)
      - key: FRONTEND_URL
        sync: false
        # Your Vercel frontend URL (with https://)
      - key: CORS_ORIGIN
        sync: false
        # Your Vercel frontend URL (with https://)
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production

